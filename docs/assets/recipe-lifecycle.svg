<svg xmlns="http://www.w3.org/2000/svg" width="900" height="464" viewBox="0 0 900 464" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">At startup, choose one path</title>
  <desc id="desc">Fixed settings apply to every batch. In a reports-only run, the framework also takes periodic measurements. Allowing changes adds a periodic comparison and manual or automatic approval. Without an accepted proposal the next batch keeps the current settings. An approved change is applied on the learner and acknowledged by every rollout replica before the next batch.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #fbfdfc; --ink: #152f38; --body: #405a63; --edge: #c8dcd6;
      --green: #116b5f; --wash: #e8f5ef; --panel: #f2f8f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #12232c; --ink: #eef6f7; --body: #c2d3d6; --edge: #435c62;
        --green: #94e3c8; --wash: #1d3938; --panel: #192d34;
      }
    }
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: var(--ink); }
    .title { font-size: 30px; font-weight: 700; }
    .heading { font-size: 22px; font-weight: 700; }
    .outcome { font-size: 17px; font-weight: 700; }
    .body { font-size: 16px; fill: var(--body); }
    .icon { fill: none; stroke: var(--green); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect x="1" y="1" width="898" height="462" rx="18" fill="var(--paper)" stroke="var(--edge)"/>
    <text x="31" y="45" class="title">At startup, choose one path</text>
    <text x="32" y="76" class="body">Select a recipe and its layers, then choose a path the recipe supports.</text>
  <g>
    <rect x="28" y="99" width="272" height="140" rx="12" fill="var(--paper)" stroke="var(--edge)"/>
    <g transform="translate(44 118)"><g class="icon"><rect x="2" y="10" width="17" height="13" rx="3"/><path d="M6 10V7a4.5 4.5 0 0 1 9 0v3m-4.5 6v2"/></g></g>
    <text x="74" y="139" class="heading">Use fixed settings</text>
    <text x="44" y="173" class="body">Train and sample with the</text>
    <text x="44" y="195" class="body">initial settings every batch.</text>
  </g>
  <g>
    <rect x="314" y="99" width="272" height="140" rx="12" fill="var(--paper)" stroke="var(--edge)"/>
    <g transform="translate(330 118)"><g class="icon"><path d="M1 3v19h21M6 17v-5m6 5V8m6 9V4"/></g></g>
    <text x="360" y="139" class="heading">Get reports only</text>
    <text x="330" y="173" class="body">Measure the layers periodically.</text>
    <text x="330" y="195" class="body">Keep the recipe settings fixed.</text>
  </g>
  <g>
    <rect x="600" y="99" width="272" height="140" rx="12" fill="var(--wash)" stroke="var(--green)"/>
    <g transform="translate(616 118)"><g class="icon"><path d="M1 6h6m6 0h8M1 17h12m6 0h2"/><circle cx="10" cy="6" r="3"/><circle cx="16" cy="17" r="3"/></g></g>
    <text x="646" y="139" class="heading">Allow changes</text>
    <text x="616" y="173" class="body">Test new settings periodically.</text>
    <text x="616" y="195" class="body">Choose manual or rule-based</text>
    <text x="616" y="217" class="body">approval at startup.</text>
  </g>
  <path class="icon" d="M736 240v21m-5-6 5 6 5-6"/>
  <rect x="28" y="265" width="844" height="177" rx="12" fill="var(--panel)" stroke="var(--edge)"/>
    <text x="45" y="298" class="heading">At each scheduled check</text>
    <text x="45" y="324" class="body">Measure the permitted layers. Compare any proposed change with the current settings on the same inputs.</text>
  <path d="M45 340h810m-440 14v70" fill="none" stroke="var(--edge)"/>
    <text x="45" y="375" class="outcome">No proposal passes, or you decline</text>
    <text x="45" y="402" class="body">The next batch uses the current settings.</text>
    <text x="434" y="375" class="outcome">A proposal passes and is approved</text>
    <text x="434" y="402" class="body">The learner applies it. Once all rollout replicas</text>
    <text x="434" y="423" class="body">confirm, the next batch uses the new settings.</text>
</svg>
