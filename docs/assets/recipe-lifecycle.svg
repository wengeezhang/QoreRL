<svg xmlns="http://www.w3.org/2000/svg" width="900" height="486" viewBox="0 0 900 486" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">How to run a recipe</title>
  <desc id="desc">Choose a recipe and the layers it covers, then start training. Fixed runs use the same settings for every batch. Turn on periodic observation for reports. If the recipe supports changes, compare a candidate with the current settings and approve manually or by rule. After publication the next batch uses the new settings. Rejected or unqualified candidates leave the current settings in use.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #fbfdfc; --ink: #152f38; --body: #405a63; --edge: #d3e2df;
      --green: #106e61; --line: #6da99e; --badge: #18564e; --accent-bg: #e7f5ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #12232c; --ink: #eef6f7; --body: #c2d3d6; --edge: #384e56;
        --green: #9fe6ce; --line: #77ad9f; --badge: #23675c; --accent-bg: #1b3838;
      }
    }
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: var(--ink); }
    .title { font-size: 32px; font-weight: 700; }
    .step { font-size: 22px; font-weight: 700; }
    .body { font-size: 16px; fill: var(--body); }
    .choice { font-size: 17px; font-weight: 700; }
    .when { font-size: 15px; fill: var(--green); font-weight: 600; }
    .num { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: white; text-anchor: middle; }
    .flow, .exit { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .flow { stroke: var(--green); stroke-width: 2; }
    .exit { stroke: var(--line); stroke-width: 1.7; }
  </style>
  <rect x="1" y="1" width="898" height="484" rx="20" fill="var(--paper)" stroke="var(--edge)"/>
  <text x="31" y="46" class="title">How to run a recipe</text>
  <path d="M32 64H868" stroke="var(--edge)"/>
  <rect x="24" y="396" width="852" height="72" rx="11" fill="var(--accent-bg)"/>

  <g>
    <circle cx="52" cy="100" r="16" fill="var(--badge)"/>
    <text x="52" y="106" class="num">1</text>
    <text x="85" y="107" class="step">Choose a recipe and its layers</text>
    <text x="85" y="132" class="body">Start rollout and training with those settings.</text>
  </g>
  <g>
    <path d="M490 100h39m-6 -5 6 5-6 5" class="exit"/>
    <text x="549" y="106" class="choice">Keep the recipe fixed</text>
    <text x="549" y="131" class="body">Use the initial settings every batch.</text>
    <path d="M52 120V184m-4 -6 4 6 4-6" class="flow"/>
    <text x="67" y="172" class="when">If you enable observation</text>
  </g>

  <g>
    <circle cx="52" cy="207" r="16" fill="var(--badge)"/>
    <text x="52" y="213" class="num">2</text>
    <text x="85" y="214" class="step">Measure the selected layers</text>
    <text x="85" y="239" class="body">Collect evidence at each scheduled check.</text>
  </g>
  <g>
    <path d="M490 207h39m-6 -5 6 5-6 5" class="exit"/>
    <text x="549" y="213" class="choice">Collect reports only</text>
    <text x="549" y="238" class="body">Write the report. Keep the current settings.</text>
    <path d="M52 227V291m-4 -6 4 6 4-6" class="flow"/>
    <text x="67" y="279" class="when">If you allow adjustments</text>
  </g>

  <g>
    <circle cx="52" cy="314" r="16" fill="var(--badge)"/>
    <text x="52" y="320" class="num">3</text>
    <text x="85" y="321" class="step">Prepare and test a candidate</text>
    <text x="85" y="346" class="body">Compare it with the current settings on the same inputs.</text>
  </g>
  <g>
    <path d="M490 314h39m-6 -5 6 5-6 5" class="exit"/>
    <text x="549" y="320" class="choice">No candidate qualifies, or you decline</text>
    <text x="549" y="345" class="body">Continue with the current settings.</text>
    <path d="M52 334V400m-4 -6 4 6 4-6" class="flow"/>
    <text x="67" y="386" class="when">Once approved by you or a rule</text>
  </g>

  <g>
    <circle cx="52" cy="423" r="16" fill="var(--badge)"/>
    <text x="52" y="429" class="num">4</text>
    <text x="85" y="430" class="step">Use the new settings in the next batch</text>
    <text x="85" y="455" class="body">The learner applies the change and every rollout replica confirms it.</text>
  </g>
  <text x="852" y="454" text-anchor="end" class="when">At the next check, repeat step 2</text>
</svg>
