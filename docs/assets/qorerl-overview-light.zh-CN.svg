<text x="1090" y="489" font-size="22" font-weight="500" fill="#17243A" text-anchor="start">验证调整效果</text>
<text x="1090" y="513" font-size="17" font-weight="400" fill="#52617A" text-anchor="start">检查质量与额外开销</text>
<circle cx="1071" cy="543" r="5" fill="#72809A"/>
<text x="1090" y="550" font-size="22" font-weight="500" fill="#17243A" text-anchor="start">调整精度</text>
<text x="1090" y="574" font-size="17" font-weight="400" fill="#52617A" text-anchor="start">依据训练反馈执行变更</text>
<text x="1058" y="612" font-size="20" font-weight="400" fill="#52617A" text-anchor="start">自动调整是长期研究目标</text>
<path d="M56 687 H1384" fill="none" stroke="#DAE2ED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="732" font-size="30" font-weight="600" fill="#17243A" text-anchor="start" letter-spacing="-0.45">从可复用的 recipe 和可恢复的训练，走向自适应精度</text>
<text x="56" y="773" font-size="23" font-weight="400" fill="#52617A" text-anchor="start">目标是在保持训练质量和稳定性的前提下，降低强化学习的计算成本。</text>
