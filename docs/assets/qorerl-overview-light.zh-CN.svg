<text x="462" y="294" font-size="17" font-weight="700" fill="#137D76" text-anchor="start" letter-spacing="1">02 / 训练与恢复</text>
<text x="1058" y="294" font-size="16" font-weight="600" fill="#52617A" text-anchor="start" letter-spacing="0.55">03 / 长期研究</text>
