<text x="1090" y="428" font-size="22" font-weight="500" fill="#17243A" text-anchor="start">Compare candidates</text>
<text x="1090" y="452" font-size="17" font-weight="400" fill="#52617A" text-anchor="start">Measure intervention benefits</text>
<circle cx="1071" cy="482" r="5" fill="#72809A"/>
<text x="1090" y="489" font-size="22" font-weight="500" fill="#17243A" text-anchor="start">Validate adjustments</text>
<text x="1090" y="513" font-size="17" font-weight="400" fill="#52617A" text-anchor="start">Check quality and overhead</text>
<circle cx="1071" cy="543" r="5" fill="#72809A"/>
<text x="1090" y="550" font-size="22" font-weight="500" fill="#17243A" text-anchor="start">Adapt precision</text>
<text x="1090" y="574" font-size="17" font-weight="400" fill="#52617A" text-anchor="start">Act on training feedback</text>
<text x="1058" y="612" font-size="20" font-weight="400" fill="#52617A" text-anchor="start">Automation is a research goal.</text>
<path d="M56 687 H1384" fill="none" stroke="#DAE2ED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="732" font-size="30" font-weight="600" fill="#17243A" text-anchor="start" letter-spacing="-0.45">Usable recipes. Recoverable training. A path to adaptation.</text>
<text x="56" y="773" font-size="23" font-weight="400" fill="#52617A" text-anchor="start">Goal: reduce RL compute cost while preserving training quality and stability.</text>
