<text x="233" y="559" font-size="23" font-weight="600" fill="#6952D8" text-anchor="middle">training recipes</text>
<text x="233" y="612" font-size="20" font-weight="400" fill="#52617A" text-anchor="middle">Select what fits your workload.</text>
