<text x="862" y="430" font-size="23" font-weight="600" fill="#137D76" text-anchor="middle">Pause &amp; save</text>
<text x="862" y="457" font-size="20" font-weight="400" fill="#52617A" text-anchor="middle">On configured alerts</text>
<text x="862" y="555" font-size="23" font-weight="600" fill="#137D76" text-anchor="middle">User adjusts recipe</text>
<text x="862" y="582" font-size="20" font-weight="400" fill="#52617A" text-anchor="middle">Review evidence</text>
<text x="582" y="555" font-size="23" font-weight="600" fill="#137D76" text-anchor="middle">Resume &amp; evaluate</text>
<text x="582" y="582" font-size="20" font-weight="400" fill="#52617A" text-anchor="middle">Measure the effect</text>
