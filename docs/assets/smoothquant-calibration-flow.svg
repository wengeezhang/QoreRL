<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1040" viewBox="0 0 1024 1040" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Dynamic SmoothQuant calibration and publication</title>
  <desc id="desc">Each batch starts with sampling, learning and publishing the weights with the active smoothing factors. At a calibration boundary, replay the batch, discover outliers and compare candidate factors on held-out inputs. Save a checkpoint before approval. The learner installs accepted factors and all rollout replicas acknowledge the version before the next batch. Imported factors can be validated and applied at startup.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #142e38; }
      .title { font-size: 40px; font-weight: 700; }
      .stage { font-size: 26px; font-weight: 650; }
      .body { font-size: 16.5px; fill: #38525b; }
      .small { font-size: 17px; fill: #48616a; }
      .label { font-size: 18px; font-weight: 620; }
      .number { font-size: 16px; font-weight: 700; fill: white; text-anchor: middle; }
      .rule { stroke: #d6e3e1; stroke-width: 1.3; }
      .route { fill: none; stroke: #197c73; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .enter { fill: none; stroke: #6953ad; stroke-width: 2; stroke-dasharray: 4 5; stroke-linecap: round; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; }
    </style>
    <marker id="forward" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="m1 1 4.5 3L1 7" fill="none" stroke="#197c73" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="entry" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="m1 1 4.5 3L1 7" fill="none" stroke="#6953ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1022" height="1038" rx="24" fill="#fbfdfc" stroke="#d0dfdd" stroke-width="2"/>
  <text x="42" y="48" font-size="22" font-weight="740" fill="#126c64">QoreRL</text>
  <path d="M140 30v21" class="rule"/>
  <text x="158" y="47" class="small">Synchronous GRPO</text>
  <text x="42" y="103" class="title">Dynamic SmoothQuant calibration and publication</text>
  <text x="44" y="139" class="body">Select the layers that use MXFP8 and the subset that also uses per-channel smoothing factors S.</text>

  <!-- The normal publish completes before calibration is considered. -->
  <rect x="40" y="168" width="944" height="92" rx="14" fill="#123944"/>
  <g fill="none" stroke="#83d7c8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 200h24m-24 7h17m-17 7h21"/>
    <path d="M344 212h5v-8h7v-8h8"/>
    <path d="M645 203h17m-6-6 7 6-7 6m-11 7h18"/>
  </g>
  <g font-size="23" font-weight="640" style="fill:white">
    <text x="98" y="209" style="fill:white">Rollout</text>
    <text x="377" y="209" style="fill:white">Learner update</text>
    <text x="681" y="209" style="fill:white">Publish weights</text>
  </g>
  <g font-size="17">
    <text x="98" y="237" style="fill:#c3dcd9">Sample a group per prompt</text>
    <text x="377" y="237" style="fill:#c3dcd9">Use group advantages</text>
    <text x="681" y="237" style="fill:#c3dcd9">Use active S and wait for acks</text>
  </g>
  <path d="m293 205 8 8-8 8m296-16 8 8-8 8" fill="none" stroke="#82a9a9" stroke-width="2.5"/>

  <path d="M770 260v13H78q-10 0-10 10v39" class="route" marker-end="url(#forward)"/>
  <path d="M770 273h32" class="route" marker-end="url(#forward)"/>
  <circle cx="770" cy="273" r="3.5" fill="#197c73"/>
  <text x="91" y="303" class="label" style="fill:#11695f">Calibration due (default: every 20 optimizer updates)</text>
  <text x="806" y="300" class="small">Continue sampling</text>

  <!-- The vertical rail carries only the path that yields an accepted proposal. -->
  <path d="M68 359v84 M68 478v144 M68 657v129" class="route"/>
  <path d="M68 821v112" class="route" marker-end="url(#forward)"/>
  <line x1="104" y1="420" x2="980" y2="420" class="rule"/>
  <line x1="104" y1="604" x2="980" y2="604" class="rule"/>
  <line x1="104" y1="766" x2="980" y2="766" class="rule"/>

  <circle cx="68" cy="342" r="17" fill="#13776c"/>
  <text x="68" y="348" class="number">1</text>
  <text x="104" y="350" class="stage">Find outlier channels</text>
  <text x="104" y="383" class="body">Replay prefixes and observe inputs to eligible MXFP8 layers.</text>
  <path d="M553 348h36" class="route" marker-end="url(#forward)"/>
  <text x="611" y="349" class="label">Diagnostics only?</text>
  <text x="611" y="381" class="body">Record layer outlier scores and keep S.</text>

  <circle cx="68" cy="461" r="17" fill="#13776c"/>
  <text x="68" y="467" class="number">2</text>
  <text x="104" y="469" class="stage">Fit and validate S</text>
  <text x="104" y="505" class="body">Fit S on one subset. Test on held-out inputs.</text>
  <text x="104" y="536" class="body">Compare against plain MXFP8 or MXFP8 with current S.</text>
  <path d="M132 566H87" class="enter" marker-end="url(#entry)"/>
  <text x="146" y="571" class="small" style="fill:#634e9e">Already know the targets? Start with fitting.</text>

  <rect x="582" y="437" width="397" height="151" rx="12" fill="#eef5f3"/>
  <text x="602" y="465" class="label">CPU example · relative layer output error</text>
  <text x="602" y="495" class="small">Layer</text>
  <text x="696" y="495" class="small">Current → candidate</text>
  <path d="M602 506h357" class="rule"/>
  <text x="603" y="532" class="label">Layer 0</text>
  <text x="696" y="532" class="mono" font-size="18">7.82% → 4.79%</text>
  <text x="886" y="532" class="label" style="fill:#0b7163">Propose</text>
  <text x="603" y="566" class="label">Layer 1</text>
  <text x="696" y="566" class="mono" font-size="18">3.31% → 3.86%</text>
  <text x="902" y="566" class="label" style="fill:#53656b">Keep</text>

  <circle cx="68" cy="640" r="17" fill="#13776c"/>
  <text x="68" y="646" class="number">3</text>
  <text x="104" y="649" class="stage">Checkpoint and review</text>
  <text x="104" y="684" class="body">Checkpoint only when a candidate meets the criteria.</text>
  <text x="104" y="717" class="body">If no candidate qualifies, continue with the current S.</text>
  <path d="M582 637v89" stroke="#c4b9df" stroke-width="3" stroke-linecap="round"/>
  <text x="602" y="650" class="label" style="fill:#624e96">Manual</text>
  <text x="676" y="650" class="small">Pause and accept or reject on resume.</text>
  <text x="602" y="685" class="label" style="fill:#624e96">Auto</text>
  <text x="676" y="685" class="small">Accept candidates that meet the criteria.</text>
  <text x="602" y="722" class="small">Rejected → keep current S and resume.</text>

  <circle cx="68" cy="804" r="17" fill="#13776c"/>
  <text x="68" y="810" class="number">4</text>
  <text x="104" y="813" class="stage">Publish approved S</text>
  <text x="104" y="849" class="body">Learner installs S and exports weights and recipe state.</text>
  <text x="104" y="881" class="body">vLLM quantizes and packs W × S again.</text>
  <path d="M598 812h-48" class="enter" marker-end="url(#entry)"/>
  <text x="611" y="817" class="label" style="fill:#624e96">Have smoothing factors at startup?</text>
  <text x="611" y="849" class="body">Validate and install before the first rollout.</text>

  <!-- Both startup import and an accepted refresh use the same publish barrier. -->
  <rect x="40" y="937" width="944" height="68" rx="13" fill="#d9eee8"/>
  <circle cx="69" cy="971" r="13" fill="#157367"/>
  <path d="m63 971 4 4 8-9" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="103" y="979" font-size="23" font-weight="650" style="fill:#144f48">All replicas confirm the policy version</text>
  <path d="M504 971h61" class="route" marker-end="url(#forward)"/>
  <text x="603" y="979" font-size="23" font-weight="650" style="fill:#144f48">Sample the next batch</text>
</svg>
