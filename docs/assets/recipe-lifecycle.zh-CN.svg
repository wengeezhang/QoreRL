<svg xmlns="http://www.w3.org/2000/svg" width="736" height="536" viewBox="0 0 736 536" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">一份 recipe 的决策流程</title>
  <desc id="desc">选好 recipe 和作用层就开始采样和训练。启用周期观测才定期测量。允许调整才比较候选和当前配置。验证通过并获批准后，两端发布变更，从下一批开始使用。到下个检查周期再次观测。</desc>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #fbfdfc; --ink: #152f38; --body: #405a63; --edge: #d3e2df;
      --green: #106e61; --badge: #18564e; --accent-bg: #e7f5ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #12232c; --ink: #eef6f7; --body: #c2d3d6; --edge: #384e56;
        --green: #9fe6ce; --badge: #23675c; --accent-bg: #1b3838;
      }
    }
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: var(--ink); }
    .title { font-size: 29px; font-weight: 700; }
    .step { font-size: 22px; font-weight: 700; }
    .body { font-size: 16px; fill: var(--body); }
    .when { font-size: 15px; fill: var(--green); font-weight: 600; }
    .num { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: white; text-anchor: middle; }
    .flow { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke: var(--green); stroke-width: 2; }
  </style>
  <rect x="1" y="1" width="734" height="534" rx="20" fill="var(--paper)" stroke="var(--edge)"/>
  <text x="30" y="44" class="title">一份 recipe 的决策流程</text>
  <text x="31" y="71" class="body">从上往下读。箭头上的问题回答「是」，才进入下一步。</text>
  <path d="M30 88H706" stroke="var(--edge)"/>
  <rect x="21" y="413" width="694" height="102" rx="12" fill="var(--accent-bg)"/>
  <circle cx="49" cy="121" r="16" fill="var(--badge)"/>
  <text x="49" y="127" class="num">1</text>
  <text x="80" y="128" class="step">在选定的层上执行 recipe</text>
  <text x="80" y="153" class="body">从第一批开始，采样和训练都使用初始配置。</text>
  <path d="M49 142V203m-4-6 4 6 4-6" class="flow"/>
  <text x="66" y="196" class="when">启用了周期观测，并且到检查时间了吗？</text>
  <circle cx="49" cy="225" r="16" fill="var(--badge)"/>
  <text x="49" y="231" class="num">2</text>
  <text x="80" y="232" class="step">收集指定层的观测数据</text>
  <text x="80" y="257" class="body">例如，记录哪些层出现了激活离群值。只开启观测时，训练沿用原配置。</text>
  <path d="M49 246V307m-4-6 4 6 4-6" class="flow"/>
  <text x="66" y="300" class="when">这份 recipe 支持调整，而且你允许它修改这些层吗？</text>
  <circle cx="49" cy="329" r="16" fill="var(--badge)"/>
  <text x="49" y="335" class="num">3</text>
  <text x="80" y="336" class="step">准备并验证候选方案</text>
  <text x="80" y="361" class="body">用相同输入比较候选方案和当前配置的效果。</text>
  <path d="M49 350V418m-4-6 4 6 4-6" class="flow"/>
  <text x="66" y="405" class="when">候选方案通过验证，并且已获你或预设规则批准了吗？</text>
  <circle cx="49" cy="441" r="16" fill="var(--badge)"/>
  <text x="49" y="447" class="num">4</text>
  <text x="80" y="448" class="step">发布获批的变更，下一批开始使用</text>
  <text x="80" y="473" class="body">训练端应用变更，所有采样副本确认后，再开始下一批采样。</text>
  <text x="80" y="501" class="when">到下一个检查周期，再从第 2 步开始。</text>
</svg>
