<svg xmlns="http://www.w3.org/2000/svg" width="900" height="486" viewBox="0 0 900 486" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">如何运行一份 recipe</title>
  <desc id="desc">选好 recipe 和作用层即可启动采样和训练。固定运行时每批沿用初始配置。启用观测后，框架按周期记录指定层的数据。只看报告时继续用当前配置。允许调整时，框架比较新旧方案。只有候选达标并获人工或规则批准，训练端应用、所有采样副本确认后，下一批才用新方案。</desc>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #fbfdfc; --ink: #152f38; --body: #405a63; --edge: #d3e2df;
      --green: #106e61; --line: #6da99e; --badge: #18564e; --accent-bg: #e7f5ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #12232c; --ink: #eef6f7; --body: #c2d3d6; --edge: #384e56;
        --green: #9fe6ce; --line: #77ad9f; --badge: #23675c; --accent-bg: #1b3838;
      }
    }
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: var(--ink); }
    .title { font-size: 32px; font-weight: 700; }
    .step { font-size: 22px; font-weight: 700; }
    .body { font-size: 16px; fill: var(--body); }
    .choice { font-size: 17px; font-weight: 700; }
    .when { font-size: 15px; fill: var(--green); font-weight: 600; }
    .num { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: white; text-anchor: middle; }
    .flow, .exit { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .flow { stroke: var(--green); stroke-width: 2; }
    .exit { stroke: var(--line); stroke-width: 1.7; }
  </style>
  <rect x="1" y="1" width="898" height="484" rx="20" fill="var(--paper)" stroke="var(--edge)"/>
  <text x="31" y="46" class="title">如何运行一份 recipe</text>
  <path d="M32 64H868" stroke="var(--edge)"/>
  <rect x="24" y="396" width="852" height="72" rx="11" fill="var(--accent-bg)"/>

  <g>
    <circle cx="52" cy="100" r="16" fill="var(--badge)"/>
    <text x="52" y="106" class="num">1</text>
    <text x="85" y="107" class="step">选 recipe 和作用层，启动训练</text>
    <text x="85" y="132" class="body">从第一批起，采样和训练都使用这份配置。</text>
  </g>
  <g>
    <path d="M490 100h39m-6 -5 6 5-6 5" class="exit"/>
    <text x="549" y="106" class="choice">只想按初始配置训练</text>
    <text x="549" y="131" class="body">每一批都沿用这份配置。</text>
    <path d="M52 120V184m-4 -6 4 6 4-6" class="flow"/>
    <text x="67" y="172" class="when">启用周期观测</text>
  </g>

  <g>
    <circle cx="52" cy="207" r="16" fill="var(--badge)"/>
    <text x="52" y="213" class="num">2</text>
    <text x="85" y="214" class="step">每到检查周期，观测指定层</text>
    <text x="85" y="239" class="body">例如，记录哪些层的激活出现了离群值。</text>
  </g>
  <g>
    <path d="M490 207h39m-6 -5 6 5-6 5" class="exit"/>
    <text x="549" y="213" class="choice">只想看报告</text>
    <text x="549" y="238" class="body">写出观测结果，沿用当前配置。</text>
    <path d="M52 227V291m-4 -6 4 6 4-6" class="flow"/>
    <text x="67" y="279" class="when">允许调整</text>
  </g>

  <g>
    <circle cx="52" cy="314" r="16" fill="var(--badge)"/>
    <text x="52" y="320" class="num">3</text>
    <text x="85" y="321" class="step">生成候选方案，验证效果</text>
    <text x="85" y="346" class="body">用同一批输入比较候选方案和当前方案。</text>
  </g>
  <g>
    <path d="M490 314h39m-6 -5 6 5-6 5" class="exit"/>
    <text x="549" y="320" class="choice">没有合格候选，或你拒绝</text>
    <text x="549" y="345" class="body">按当前配置继续训练。</text>
    <path d="M52 334V400m-4 -6 4 6 4-6" class="flow"/>
    <text x="67" y="386" class="when">你已批准，或预设规则已通过</text>
  </g>

  <g>
    <circle cx="52" cy="423" r="16" fill="var(--badge)"/>
    <text x="52" y="429" class="num">4</text>
    <text x="85" y="430" class="step">下一批开始使用新方案</text>
    <text x="85" y="455" class="body">训练端先应用变更，所有采样副本确认后再采样。</text>
  </g>
  <text x="852" y="454" text-anchor="end" class="when">下个检查周期回到第 2 步</text>
</svg>
