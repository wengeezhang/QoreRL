[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qorerl"
version = "0.1.0"
description = "An early-stage quantization-native RL framework for reproducible methods and guided training workflows"
requires-python = ">=3.12"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
qorerl = "qorerl.experiment:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
